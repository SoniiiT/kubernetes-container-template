apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: moodle
  namespace: moodle
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`moodle.example.net`)
      kind: Rule
      services:
        - name: moodle
          port: 6060
  tls:
    secretName: letsencrypt-production-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-production
  namespace: moodle
spec:
  secretName: letsencrypt-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "moodle.example.net"