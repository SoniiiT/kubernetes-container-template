apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: homepage
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homepage.example.net`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
  tls:
    secretName: letsencrypt-production-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-production
  namespace: homepage
spec:
  secretName: letsencrypt-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "homepage.example.net"