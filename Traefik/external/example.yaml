apiVersion: v1
kind: Service
metadata:
  name: example-route
  namespace: traefik-external
spec:
  type: ExternalName
  externalName: 192.168.178.100
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: example-route
  namespace: traefik-external
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`example.example.net`)
      kind: Rule
      services:
        - name: example-route
          namespace: traefik-external
          port: 80
          scheme: http
  tls:
    secretName: letsencrypt-production-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-production-example-route
  namespace: traefik-external
spec:
  secretName: letsencrypt-production-tls
  issuerRef:
    name: letsencrypt-production-issuer
    kind: ClusterIssuer
  dnsNames:
    - "example.example.net"