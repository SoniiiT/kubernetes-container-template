apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.example.net`)
      kind: Rule
      middlewares:
        - name: traefik-dashboard-basicauth
          namespace: traefik
      services:
        - name: api@internal
          kind: TraefikService
  tls:
    secretName: letsencrypt-production-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-production
  namespace: traefik
spec:
  secretName: letsencrypt-production-tls
  issuerRef:
    name: letsencrypt-production-issuer
    kind: ClusterIssuer
  dnsNames:
    - "*.example.net"
    - "traefik.example.net"