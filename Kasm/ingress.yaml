apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kasm
  namespace: kasm
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kasm.example.net`)
      kind: Rule
      services:
        - name: kasm-server
          port: 443
  tls:
    secretName: letsencrypt-production-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-production
  namespace: kasm
spec:
  secretName: letsencrypt-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "kasm.example.net"