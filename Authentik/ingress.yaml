apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`authentik.example.net`)
      kind: Rule
      services:
        - name: authentik-server
          port: 443
  tls:
    secretName: letsencrypt-production-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-production
  namespace: authentik
spec:
  secretName: letsencrypt-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "authentik.example.net"